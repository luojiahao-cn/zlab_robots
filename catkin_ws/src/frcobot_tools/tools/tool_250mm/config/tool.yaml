# 工具包配置文件 - 250mm工具
tool_info:
  name: "tool_250mm"
  display_name: "250mm工具"
  description: "250mm长度的标准工具"
  version: "1.0.0"
  author: "FRCobot Team"

tool_type: "simple"

origin:
  xyz: [0, 0, 0]  # 相对于法兰中心的位置
  rpy: [0, 0, 0]

tcp:
  xyz: [0, 0, 0.25]  # TCP在工具末端，距离工具坐标系0.25米
  rpy: [0, 0, 0]

physical_properties:
  mass: 0.05  # kg
  inertia:
    ixx: 5.82E-7
    ixy: 0.0
    ixz: 0.0
    iyy: 1.15E-8
    iyz: 0.0
    izz: 5.82E-7

visual:
  mesh_path: "package://frcobot_description/meshes/fr5v6/visual/toolA-250mm.DAE"
  scale: [0.001, 0.001, 0.001]

collision:
  mesh_path: "package://frcobot_description/meshes/fr5v6/collision/toolA-250mm.STL"
  scale: [0.001, 0.001, 0.001]

moveit:
  end_effector_link: "tcp_link"  # 使用TCP链接作为末端执行器
  planning_frame_offset: [0, 0, 0]

