# =============================================================
# ZLab 三臂协同环境障碍物配置文件 (zlab_environment.yaml)
# =============================================================
# 坐标系：
#   - world: 全局世界坐标系 (Origin at base0)
# # 单位：米 (m)
# =============================================================

collision_objects:
  # -------------------------------------------------------------
  # 1. 外部空间边界 (围栏区域 X: [-0.328, 1.86], Y: [-1.5, 0.938])
  # -------------------------------------------------------------

  # 后墙：连接左、右墙，厚度 1cm，高度 3m
  - id: back_wall
    type: box
    frame_id: "world"
    position: [-0.328, -0.281, 1.5]
    orientation: [0, 0, 0, 1]
    dimensions: [0.01, 2.438, 3]
    color: [0.6, 0.6, 0.6, 0.5]

  # 左侧防护墙：平行于 XZ 平面
  - id: left_wall
    type: box
    frame_id: "world"
    position: [0.766, 0.938, 1.5]
    orientation: [0, 0, 0, 1]
    dimensions: [2.188, 0.01, 3]
    color: [0.6, 0.6, 0.6, 0.5]

  # 右侧防护墙：平行于 XZ 平面
  - id: right_wall
    type: box
    frame_id: "world"
    position: [0.766, -1.5, 1.5]
    orientation: [0, 0, 0, 1]
    dimensions: [2.188, 0.01, 3]
    color: [0.6, 0.6, 0.6, 0.5]

  # 前方防护墙：平行于 YZ 平面
  - id: front_wall
    type: box
    frame_id: "world"
    position: [1.89, -0.281, 1.5]
    orientation: [0, 0, 0, 1]
    dimensions: [0.01, 2.438, 3]
    color: [0.6, 0.6, 0.6, 0.1]

  # 工作地表：精确匹配四面墙围成的闭合范围
  - id: ground
    type: box
    frame_id: world
    position: [0.766, -0.281, -0.06] # 下沉 1cm 避开基座干涉
    orientation: [0, 0, 0, 1]
    dimensions: [2.188, 2.438, 0.1]
    color: [0.5, 0.5, 0.5, 0.5]

  # -------------------------------------------------------------
  # 2. 内部功能设备
  # -------------------------------------------------------------

  # 扫描实验桌：桌面高度 0.75m，底部悬空 30cm (1.2m x 0.6m)
  - id: scanning_table
    type: box
    frame_id: world
    position: [0.83, -0.1, 0.728]
    orientation: [0, 0, 0, 1]
    dimensions: [0.6, 1.3, 0.05]
    color: [0.6, 0.6, 0.6, 0.8]

  # 电源控制柜：高度 0.65m，与扫描桌右后侧相邻
  - id:   power_control_cabinet
    type: box
    frame_id: world
    position: [0.866, -0.387, 0.325]
    orientation: [0, 0, 0, 1]
    dimensions: [0.528, 0.426, 0.65]
    color: [0.6, 0.6, 0.6, 0.8]

  # -------------------------------------------------------------
  # 3. 操作区与辅助设备 (紧贴右侧围墙)
  # -------------------------------------------------------------

  # 电脑操作台下部分：占用右后方内部空间，高度 0-1.2m
  - id: pc_console_lower
    type: box
    frame_id: "world"
    position: [-0.2, -0.988, 0.6]
    orientation: [0, 0, 0, 1]
    dimensions: [0.926, 1.024, 1.2]
    color: [0.6, 0.6, 0.6, 0.5]

  # 操作台上部设备/避障体积：高度 1.2-1.9m
  - id: pc_console_upper
    type: box
    frame_id: "world"
    position: [-0.114, -1.125, 1.55]
    orientation: [0, 0, 0, 1]
    dimensions: [0.428, 0.75, 0.7]
    color: [0.6, 0.6, 0.6, 0.5]
