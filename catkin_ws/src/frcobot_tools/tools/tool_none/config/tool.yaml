# 工具包配置文件
# 此文件定义了工具的所有配置信息

# 工具基本信息
tool_info:
  name: "none"
  display_name: "无工具"
  description: "默认配置，无末端执行器"
  version: "1.0.0"
  author: "FRCobot Team"

# 工具类型: "simple" (简单配置) 或 "urdf_package" (完整URDF包)
tool_type: "simple"

# 工具相对于法兰的安装位置 (相对于j6_link)
# 注意：当前系统在ee_joint中已有0.1m的法兰偏移
origin:
  xyz: [0, 0, 0]  # 相对于法兰中心的位置
  rpy: [0, 0, 0]

# TCP (Tool Center Point) 相对于工具坐标系的位置
tcp:
  xyz: [0, 0, 0]
  rpy: [0, 0, 0]

# 物理属性（用于动力学计算）
physical_properties:
  mass: 0.1  # kg
  inertia:
    ixx: 0.1
    ixy: 0.0
    ixz: 0.0
    iyy: 0.1
    iyz: 0.0
    izz: 0.1

# 可视化配置（可选，如果tool_type为simple）
visual:
  mesh_path: ""  # 如果为空，则不显示可视化模型
  scale: [1, 1, 1]

# 碰撞配置（可选，如果tool_type为simple）
collision:
  mesh_path: ""  # 如果为空，则不使用碰撞模型
  scale: [1, 1, 1]

# MoveIt配置
moveit:
  end_effector_link: "ee_link"  # 默认使用ee_link（机器人本体末端执行器链接），如果有TCP则使用tcp_link
  planning_frame_offset: [0, 0, 0]  # 规划框架偏移（通常不需要）

