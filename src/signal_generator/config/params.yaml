search_ports:
  - "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
baudrate: 115200

# 初始输出波形配置
initial_configs:
  - channel_index: 1
    waveform: 2
    frequency: 0.1
    amplitude: 5.0
    offset: 2.5
    phase: 0.0
    duty_cycle: 25.0
    output_en: true
    output_sync: false
  - channel_index: 2
    waveform: 2
    frequency: 0.1
    amplitude: 5.0
    offset: 2.5
    phase: 90.0
    duty_cycle: 25.0
    output_en: true
  - channel_index: 3
    waveform: 2
    frequency: 0.1
    amplitude: 5.0
    offset: 2.5
    phase: 180.0
    duty_cycle: 25.0
    output_en: true
