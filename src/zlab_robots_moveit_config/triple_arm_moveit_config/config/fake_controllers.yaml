controller_list:
  - name: fake_arm1_controller
    type: $(arg fake_execution_type)
    joints:
      - arm1_joint_1
      - arm1_joint_2
      - arm1_joint_3
      - arm1_joint_4
      - arm1_joint_5
      - arm1_joint_6
  - name: fake_arm2_controller
    type: $(arg fake_execution_type)
    joints:
      - arm2_joint_1
      - arm2_joint_2
      - arm2_joint_3
      - arm2_joint_4
      - arm2_joint_5
      - arm2_joint_6
  - name: fake_diana7_controller
    type: $(arg fake_execution_type)
    joints:
      - diana7_joint_1
      - diana7_joint_2
      - diana7_joint_3
      - diana7_joint_4
      - diana7_joint_5
      - diana7_joint_6
      - diana7_joint_7
initial:  # Define initial robot poses per group
  - group: arm1
    pose: up
  - group: arm2
    pose: up
  - group: diana7
    pose: home
