    type: $(arg fake_execution_type)
    joints:
      - arm1_j1
      - arm1_j2
      - arm1_j3
      - arm1_j4
      - arm1_j5
      - arm1_j6
  - name: fake_arm2_controller
    type: $(arg fake_execution_type)
    joints:
      - arm2_j1
      - arm2_j2
      - arm2_j3
      - arm2_j4
      - arm2_j5
      - arm2_j6
  - name: fake_diana7_controller
    type: $(arg fake_execution_type)
    joints:
      - diana7_joint_1
      - diana7_joint_2
      - diana7_joint_3
      - diana7_joint_4
      - diana7_joint_5
      - diana7_joint_6
      - diana7_joint_7
initial:  # Define initial robot poses per group
  - group: arm1
