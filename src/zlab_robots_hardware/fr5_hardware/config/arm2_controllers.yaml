# Joint state controller
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# Trajectory controller
arm2_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - arm2_joint_1
    - arm2_joint_2
    - arm2_joint_3
    - arm2_joint_4
    - arm2_joint_5
    - arm2_joint_6
  constraints:
    goal_time: 3.0
    stopped_velocity_tolerance: 0.0
    arm2_joint_1:
      trajectory: 0.02
      goal: 0.01
    arm2_joint_2:
      trajectory: 0.02
      goal: 0.01
    arm2_joint_3:
      trajectory: 0.02
      goal: 0.01
    arm2_joint_4:
      trajectory: 0.02
      goal: 0.01
    arm2_joint_5:
      trajectory: 0.02
      goal: 0.01
    arm2_joint_6:
      trajectory: 0.02
      goal: 0.01

