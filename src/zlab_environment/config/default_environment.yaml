# 环境障碍物配置
# 坐标系：相对于机器人基座（使用 {arm_id} 占位符，会自动替换为实际的 arm_id）
# 单位：米
# 注意：机械臂的基座链接是 {arm_id}_pedestal_link（最底部）或 {arm_id}_base_link（上层）
# 也可以使用 world 坐标系（固定坐标系）

collision_objects:
  # 左墙（机器人左侧）
  - id: left_wall
    type: box
    frame_id: "{arm_id}_pedestal_link"  # 使用最底部的基座链接
    position: [-0.35, -0.6062, 0.8]  # 墙中心在机器人后方 0.7m，高度中心 0.8m
    orientation: [0, 0, -0.2588, 0.9659]   # quaternion (x, y, z, w)
    dimensions: [1.6, 0.05, 1.6]  # 长、厚、 高
    color: [0.6, 0.6, 0.6, 0.5]  # r,g,b,a
    
  # 后墙（机器人后方）
  - id: back_wall
    type: box
    frame_id: "{arm_id}_pedestal_link"
    position: [-0.6062, 0.35, 0.8]       # 左侧 0.7m
    orientation: [0, 0, -0.2588, 0.9659]
    dimensions: [0.05, 1.6, 1.6]     # 厚度 0.05m，高度 1.6m，宽度 1.6m
    color: [0.6, 0.6, 0.6, 0.5]
    
  # 前墙（机器人前方）
  # - id: front_wall
  #   type: box
  #   frame_id: "{arm_id}_pedestal_link"
  #   position: [0.7, 0.0, 0.8]        # 右侧 0.7m
  #   orientation: [0, 0, 0, 1]
  #   dimensions: [0.05, 1.6, 1.6]
  #   color: [0.6, 0.6, 0.6, 0.5]
    
  # 右墙（机器人右侧）
  - id: right_wall
    type: box
    frame_id: "{arm_id}_pedestal_link"
    position: [0.35, 0.6062, 0.8]     # 前方 0.7m
    orientation: [0, 0, -0.2588, 0.9659]
    dimensions: [1.6, 0.05, 1.6]
    color: [0.6, 0.6, 0.6, 0.5]
    
  # 地面（防止向下碰撞，可选）
  - id: floor
    type: box
    frame_id: "{arm_id}_pedestal_link"
    position: [0.0, 0.0, -0.051]      # 厚度 0.1m，顶面与 base0 高度齐平
    orientation: [0, 0, -0.2588, 0.9659]
    dimensions: [1.6, 1.6, 0.1]
    color: [0.6, 0.6, 0.6, 0.5]

  - id: table
    type: box
    frame_id: "{arm_id}_pedestal_link" 
    position: [0.323, -0.438, 0.55]      # 修正中心点，使侧面位于末端前方 1cm
    orientation: [0, 0, -0.368, 0.930]   # 旋转至 -43.2 度，使侧面法线与末端朝向对齐
    dimensions: [0.6, 1.6, 0.4]     # 长、宽、高
    color: [0.6, 0.6, 0.6, 0.5]

  - id: table_2
    type: box
    frame_id: "{arm_id}_pedestal_link" 
    position: [-0.656, 0.539, 0.729]      # 综合两个面的信息计算出的中心点
    orientation: [0, 0, 0.404, 0.915]     # 旋转约 47.7 度以对齐第二个面
    dimensions: [0.8, 0.8, 0.8]
    color: [0.6, 0.6, 0.6, 0.5]

  - id: ee_front_wall
    type: box
    frame_id: "{arm_id}_pedestal_link"
    position: [-0.469, -0.254, 0.8]
    orientation: [0.198, 0.675, -0.603, -0.376]
    dimensions: [1.6, 1.6, 0.01]
    color: [0.6, 0.6, 0.6, 0.5]

# 双臂环境配置（使用world坐标系）
dual_arm_collision_objects:
