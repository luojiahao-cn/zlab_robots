# 工具包配置文件 - 磁力计阵列
tool_info:
  name: "magnetometer_array"
  display_name: "磁力计阵列"
  description: "磁力计阵列末端执行器工具"
  version: "1.0.0"

# 使用URDF包类型（从SolidWorks导出）
tool_type: "urdf_package"

# URDF包配置
urdf_package:
  # URDF文件路径（相对于工具包目录）
  urdf_file: "urdf/magnetometer_array.urdf.xacro"
  # 工具根链接名称（在URDF中定义的链接名，连接到机械臂的ee_link）
  root_link_name: "magnetometer_array_base_link"
  # TCP链接名称（URDF中已定义TCP链接）
  tcp_link_name: "magnetometer_tcp_link"
  # 工具相对于法兰的安装偏移（如果需要微调）
  mount_offset:
    xyz: [0, 0, 0]  # 根据实际安装位置调整
    rpy: [0, 0, 0]  # 根据实际安装方向调整

# 网格文件路径（相对于工具包目录，作为顶级配置项）
# 注意：TCP链接不应该有可视化内容，只用于运动学计算
visual_mesh: "meshes/magnetometer_base_link.STL"
collision_mesh: "meshes/magnetometer_base_link.STL"

# 工具相对于法兰的安装位置（如果需要在mount_offset基础上再调整）
origin:
  xyz: [0, 0, 0]  # 相对于法兰中心的位置
  rpy: [0, 0, 0]

# TCP配置（如果URDF中已有tcp_link，这个配置会被忽略）
tcp:
  xyz: [0, 0.00023753, 0.19309]
  rpy: [0, 0, 0]

# 物理属性（如果URDF中已定义，这些会被忽略）
physical_properties:
  mass: 0.0332054242847689
  inertia:
    ixx: 5.63055976294825E-05
    ixy: 5.92198383565254E-12
    ixz: 6.68013595190661E-10
    iyy: 5.96936991935191E-05
    iyz: -2.03045562894017E-06
    izz: 1.14540668478137E-05

moveit:

