arm1_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - arm1_j1
    - arm1_j2
    - arm1_j3
    - arm1_j4
    - arm1_j5
    - arm1_j6
  constraints:
    goal_time: 3.0
    stopped_velocity_tolerance: 0.0
    arm1_j1:
      trajectory: 0.05
      goal: 0.01
