diana7:
  # Hardware Interface Settings
  hardware_interface:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    ip_address: "192.168.31.200"
    loop_hz: 100.0

  # Controller Settings
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50

  position_trajectory_controller:
    type: position_controllers/JointTrajectoryController
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.1
      joint_1: {trajectory: 1.0, goal: 0.5}
      joint_2: {trajectory: 1.0, goal: 0.5}
      joint_3: {trajectory: 1.0, goal: 0.5}
      joint_4: {trajectory: 1.0, goal: 0.5}
      joint_5: {trajectory: 1.0, goal: 0.5}
      joint_6: {trajectory: 1.0, goal: 0.5}
      joint_7: {trajectory: 1.0, goal: 0.5}
    stop_trajectory_duration: 0.5
    state_publish_rate:  25
    action_monitor_rate: 10
