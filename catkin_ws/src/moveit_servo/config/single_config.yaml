###############################################
# 在此处修改所有与伺服相关的参数
###############################################
use_gazebo: true # 机器人是否在Gazebo仿真环境中启动

## 输入命令的属性
command_in_type: "speed_units" # "unitless"> 范围在 [-1:1] 之间，如同来自操纵杆。"speed_units"> 命令以 m/s 和 rad/s 为单位
scale:
  # 仅当 command_in_type=="unitless" 时使用缩放参数
  linear:  0.6  # 最大线速度。每个发布周期的米数。单位是 [m/s]。仅用于笛卡尔命令。
  rotational:  0.3 # 最大角速度。每个发布周期的弧度数。单位是 [rad/s]。仅用于笛卡尔命令。
  # 最大关节角速度/线速度。每个发布周期的弧度或米数。仅用于 joint_command_in_topic 上的关节命令。
  joint: 0.01
low_pass_filter_coeff: 2.  # 值越大 --> 越信任过滤后的数据，越不信任测量值。

## 输出命令的属性
publish_period: 0.008  # 1/标称发布速率 [秒]
low_latency_mode: false  # 设置为 true 以在接收到传入的 Twist 命令时立即发布（忽略 publish_period）

# 您的机器人驱动程序期望什么类型的话题？
# 目前支持 std_msgs/Float64MultiArray（用于 ros_control JointGroupVelocityController 或 JointGroupPositionController）
# 或 trajectory_msgs/JointTrajectory（用于 Universal Robots 和其他非 ros_control 机器人）
command_out_type: std_msgs/Float64MultiArray

# 发布什么？可以节省一些带宽，因为大多数机器人只需要位置或速度
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false

## MoveIt 属性
move_group_name:  fr5v6_arm  # 通常为 'manipulator' 或 'arm'
planning_frame: world  # MoveIt 规划框架。通常为 'base_link' 或 'world'

## 其他框架
ee_frame_name: frrobot_tool_tcp_link  # 末端执行器链接的名称，用于返回 EE 姿态
robot_link_command_frame:  world  # 命令必须在机器人的链接框架中给出。通常为基座或末端执行器

## 停止行为
incoming_command_timeout:  1  # 如果 X 秒内没有新命令，则停止伺服
# 如果为 0，即使机器人静止也会永远重新发布命令。否则，指定要发布的数量。
# 这很重要，因为 ROS 可能会丢弃一些消息，我们需要机器人可靠地停止。
num_outgoing_halt_msgs_to_publish: 4

## 配置奇异性和关节限制的处理
lower_singularity_threshold:  17  # 当条件数达到此值时开始减速（接近奇异性）
hard_stop_singularity_threshold: 30 # 当条件数达到此值时停止
joint_limit_margin: 0.1 # 添加到关节限制的缓冲 [弧度]。如果移动速度快，请将其设置得更大。

## 话题名称
cartesian_command_in_topic: delta_twist_cmds  # 传入笛卡尔 twist 命令的话题
joint_command_in_topic: delta_joint_cmds # 传入关节角度命令的话题
joint_topic: joint_states
status_topic: status # 将状态发布到此话题
command_out_topic: /joints_position_controller/command # 在此处发布输出命令

## 整个机器人身体的碰撞检查
check_collisions: true # 检查碰撞？
collision_check_rate: 50 # [Hz] 如果碰撞检查频率过高，可能会拖慢 CPU。
# 有两种碰撞检查算法可用：
# "threshold_distance" 在距离小于指定距离时开始减速。如果您想手动调整碰撞阈值，这种方法很好。
# "stop_distance" 如果碰撞距离小于最坏情况下的停止距离并且距离在减小，则停止。需要关节加速度限制
collision_check_type: threshold_distance
# "threshold_distance" 类型碰撞检查的参数
self_collision_proximity_threshold: 0.01 # 当自碰撞距离为此值时开始减速 [米]
scene_collision_proximity_threshold: 0.05 # 当场景碰撞距离为此值时开始减速 [米]
# "stop_distance" 类型碰撞检查的参数
collision_distance_safety_factor: 1000 # 必须 >= 1。建议使用较大的安全系数以应对延迟
min_allowable_collision_distance: 0.01 # 如果碰撞距离小于此值则停止 [米]

