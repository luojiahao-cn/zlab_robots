# Hardware interface settings
# Note: joints will be set dynamically based on arm_id parameter in launch file
hardware_interface:
  joints: []  # Will be overridden by launch file

# Control loop settings
loop_hz: 60.0
cycle_time_error_threshold: 0.01

# Motion parameters
acc: 0.0
vel: 0.0
cmd_t: 0.002
filter_t: 0.002
gain: 0.0

# Joint state controller
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# Trajectory controller template
# Note: Controller name (arm1_controller or arm2_controller) and joints 
# will be set dynamically based on arm_id parameter in launch file
arm1_controller:
  type: position_controllers/JointTrajectoryController
  joints: []  # Will be overridden by launch file
  constraints:
    goal_time: 3.0
    stopped_velocity_tolerance: 0.0
    # Joint-specific constraints will be set dynamically

arm2_controller:
  type: position_controllers/JointTrajectoryController
  joints: []  # Will be overridden by launch file
  constraints:
    goal_time: 3.0
    stopped_velocity_tolerance: 0.0
    # Joint-specific constraints will be set dynamically

